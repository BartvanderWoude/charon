[package]
name = "charon"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Expose a Prolog knowledge base over HTTP/JSON API, with an OpenAPI description."
publish = false

[dependencies]
axum = "0.8.9"
json = "0.12.4"
parking_lot = "0.12.5"
regex = "1.13.1"
scryer-prolog = { git = "https://github.com/mthom/scryer-prolog.git", default-features = false, rev = "295a642" }
tokio = { version = "1.53.1", features = ["rt-multi-thread"] }
utoipa = "5.5.0"

[dev-dependencies]
axum-test = "21.0.0"
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros"] }
